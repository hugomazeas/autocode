<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>renderJobsList Tests</title>
</head>
<body>
<div id="test-output" style="font-family:monospace; white-space:pre; padding:20px;"></div>
<div id="jobs-list" style="display:none;"></div>

<script>
/* === Minimal test harness === */
let _passed = 0, _failed = 0;
const _out = [];

function assert(cond, msg) {
    if (cond) { _passed++; _out.push('  PASS: ' + msg); }
    else { _failed++; _out.push('  FAIL: ' + msg); }
}

function assertEqual(actual, expected, msg) {
    assert(actual === expected, msg + ` (expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)})`);
}

function test(name, fn) {
    _out.push('TEST: ' + name);
    try { fn(); } catch (e) { _failed++; _out.push('  FAIL (exception): ' + e.message); }
}

function report() {
    _out.push('');
    _out.push(`Results: ${_passed} passed, ${_failed} failed`);
    document.getElementById('test-output').textContent = _out.join('\n');
    if (typeof process !== 'undefined') process.exitCode = _failed > 0 ? 1 : 0;
}

/* === Dependencies from the app (minimal copies) === */
const STATUS_MAP = {
    queued:     { color: 'bg-yellow-400', dot: 'bg-yellow-400', text: 'text-yellow-400', label: 'Queued',   pulse: true },
    running:    { color: 'bg-yellow-400', dot: 'bg-yellow-400', text: 'text-yellow-400', label: 'Running',  pulse: true },
    done:       { color: 'bg-green-400',  dot: 'bg-green-400',  text: 'text-green-400',  label: 'Done',     pulse: false },
    failed:     { color: 'bg-red-400',    dot: 'bg-red-400',    text: 'text-red-400',    label: 'Failed',   pulse: false },
};

function esc(s) {
    if (typeof s !== 'string') s = String(s);
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

function timeAgo(ts) {
    const secs = Math.floor((Date.now() / 1000) - ts);
    if (secs < 60) return 'just now';
    if (secs < 3600) return Math.floor(secs / 60) + 'm ago';
    if (secs < 86400) return Math.floor(secs / 3600) + 'h ago';
    return Math.floor(secs / 86400) + 'd ago';
}

function truncate(s, max) {
    if (!s) return '';
    return s.length > max ? s.slice(0, max) + '...' : s;
}

function navigate() {} // stub

const collapsedRepos = new Set();

function renderJobsList(jobs, repos) {
    const container = document.getElementById('jobs-list');
    if (!container) return;

    if (jobs.length === 0) {
        container.innerHTML = '<div class="text-xs text-gray-600">No jobs yet.</div>';
        return;
    }

    container.querySelectorAll('details.repo-group').forEach(d => {
        const repoId = d.dataset.repoId;
        if (!d.open) collapsedRepos.add(repoId);
        else collapsedRepos.delete(repoId);
    });

    const repoMap = {};
    for (const r of repos) repoMap[r.id] = r;

    const groups = {};
    for (const j of jobs) {
        if (!groups[j.repo_id]) groups[j.repo_id] = [];
        groups[j.repo_id].push(j);
    }

    const sortedGroupEntries = Object.entries(groups).sort(
        (a, b) => b[1][0].created_at - a[1][0].created_at
    );

    container.innerHTML = sortedGroupEntries.map(([repoId, groupJobs]) => {
        const repo = repoMap[repoId];
        const repoName = repo ? repo.name : '?';

        const jobRows = groupJobs.map(j => {
            const s = STATUS_MAP[j.status] || STATUS_MAP.queued;
            const cost = j.total_cost ? `$${j.total_cost.toFixed(2)}` : '';
            const ago = j.created_at ? timeAgo(j.created_at) : '';

            return `
                <div class="job-list-row flex items-center gap-3 px-3 py-2 rounded" onclick="navigate('/jobs/${esc(j.id)}')">
                    <div class="w-2 h-2 rounded-full shrink-0 ${s.dot}${s.pulse ? ' pulse-dot' : ''}"></div>
                    <div class="flex-1 min-w-0">
                        <div class="text-sm text-gray-300 truncate">${esc(truncate(j.ticket, 80))}</div>
                    </div>
                    <div class="text-right shrink-0">
                        <div class="text-xs text-gray-500">${ago}</div>
                        ${cost ? `<div class="text-xs text-gray-600">${cost}</div>` : ''}
                    </div>
                </div>
            `;
        }).join('');

        return `
            <details class="repo-group" data-repo-id="${esc(repoId)}" open>
                <summary class="flex items-center gap-2 cursor-pointer px-3 py-2 rounded hover:bg-gray-800/50 select-none">
                    <svg class="w-3 h-3 text-gray-500 details-chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                    <span class="text-sm font-medium text-gray-300">${esc(repoName)}</span>
                    <span class="text-xs text-gray-600">(${groupJobs.length})</span>
                </summary>
                <div class="space-y-1">
                    ${jobRows}
                </div>
            </details>
        `;
    }).join('');

    container.querySelectorAll('details.repo-group').forEach(d => {
        if (collapsedRepos.has(d.dataset.repoId)) d.open = false;
    });
}

/* === Test Data === */
const now = Math.floor(Date.now() / 1000);

const repos = [
    { id: 1, name: 'frontend-app', url: 'https://github.com/org/frontend-app.git', default_branch: 'main' },
    { id: 2, name: 'backend-api', url: 'https://github.com/org/backend-api.git', default_branch: 'main' },
    { id: 3, name: 'infra-tools', url: 'https://github.com/org/infra-tools.git', default_branch: 'main' },
];

const jobs = [
    { id: 'j1', repo_id: 1, ticket: 'Fix button alignment', status: 'done', created_at: now - 100, total_cost: 0.50 },
    { id: 'j2', repo_id: 2, ticket: 'Add /health endpoint', status: 'running', created_at: now - 50, total_cost: null },
    { id: 'j3', repo_id: 1, ticket: 'Update CSS colors', status: 'queued', created_at: now - 200, total_cost: null },
    { id: 'j4', repo_id: 2, ticket: 'Fix DB connection pool', status: 'done', created_at: now - 300, total_cost: 1.20 },
    { id: 'j5', repo_id: 3, ticket: 'Update Terraform module', status: 'failed', created_at: now - 500, total_cost: 0.10 },
];

/* === Tests === */

test('Groups jobs by repository', () => {
    renderJobsList(jobs, repos);
    const container = document.getElementById('jobs-list');
    const groups = container.querySelectorAll('details.repo-group');
    assertEqual(groups.length, 3, 'Should have 3 repo groups');
});

test('Groups are sorted by most recent job (DESC)', () => {
    renderJobsList(jobs, repos);
    const container = document.getElementById('jobs-list');
    const groups = container.querySelectorAll('details.repo-group');
    const repoIds = Array.from(groups).map(g => g.dataset.repoId);
    // backend-api has j2 at now-50 (most recent), frontend-app has j1 at now-100, infra-tools has j5 at now-500
    assertEqual(repoIds[0], '2', 'First group should be backend-api (repo 2)');
    assertEqual(repoIds[1], '1', 'Second group should be frontend-app (repo 1)');
    assertEqual(repoIds[2], '3', 'Third group should be infra-tools (repo 3)');
});

test('Each group shows correct repo name', () => {
    renderJobsList(jobs, repos);
    const container = document.getElementById('jobs-list');
    const summaries = container.querySelectorAll('details.repo-group summary');
    assert(summaries[0].textContent.includes('backend-api'), 'First group header is backend-api');
    assert(summaries[1].textContent.includes('frontend-app'), 'Second group header is frontend-app');
    assert(summaries[2].textContent.includes('infra-tools'), 'Third group header is infra-tools');
});

test('Each group shows correct job count', () => {
    renderJobsList(jobs, repos);
    const container = document.getElementById('jobs-list');
    const summaries = container.querySelectorAll('details.repo-group summary');
    assert(summaries[0].textContent.includes('(2)'), 'backend-api has 2 jobs');
    assert(summaries[1].textContent.includes('(2)'), 'frontend-app has 2 jobs');
    assert(summaries[2].textContent.includes('(1)'), 'infra-tools has 1 job');
});

test('Job rows within groups have correct content', () => {
    renderJobsList(jobs, repos);
    const container = document.getElementById('jobs-list');
    const groups = container.querySelectorAll('details.repo-group');
    // backend-api group should have j2 and j4
    const backendRows = groups[0].querySelectorAll('.job-list-row');
    assertEqual(backendRows.length, 2, 'backend-api group has 2 job rows');
    assert(backendRows[0].textContent.includes('Add /health endpoint'), 'First backend job is j2');
    assert(backendRows[1].textContent.includes('Fix DB connection pool'), 'Second backend job is j4');
});

test('Per-row repo name is removed', () => {
    renderJobsList(jobs, repos);
    const container = document.getElementById('jobs-list');
    const rows = container.querySelectorAll('.job-list-row');
    for (const row of rows) {
        // The row should NOT contain the repo name as a separate line
        const innerDivs = row.querySelectorAll('.flex-1 > div');
        assertEqual(innerDivs.length, 1, 'Job row should only have ticket text, no repo subtitle');
    }
});

test('Empty jobs array shows no-jobs message', () => {
    renderJobsList([], repos);
    const container = document.getElementById('jobs-list');
    assert(container.innerHTML.includes('No jobs yet'), 'Shows no jobs message');
    assertEqual(container.querySelectorAll('details').length, 0, 'No details elements');
});

test('Jobs with unknown repo_id show ? as name', () => {
    const unknownJobs = [
        { id: 'j99', repo_id: 999, ticket: 'Mystery job', status: 'queued', created_at: now - 10, total_cost: null },
    ];
    renderJobsList(unknownJobs, repos);
    const container = document.getElementById('jobs-list');
    const summary = container.querySelector('details.repo-group summary');
    assert(summary.textContent.includes('?'), 'Unknown repo shows ? as name');
});

test('All details elements are open by default', () => {
    collapsedRepos.clear();
    renderJobsList(jobs, repos);
    const container = document.getElementById('jobs-list');
    const groups = container.querySelectorAll('details.repo-group');
    for (const g of groups) {
        assert(g.open, `Group ${g.dataset.repoId} should be open by default`);
    }
});

test('Collapsed state is preserved across re-renders', () => {
    collapsedRepos.clear();
    renderJobsList(jobs, repos);
    const container = document.getElementById('jobs-list');

    // Simulate user collapsing backend-api group
    const backendGroup = container.querySelector('details[data-repo-id="2"]');
    backendGroup.open = false;

    // Re-render (simulating dashboard refresh)
    renderJobsList(jobs, repos);

    const backendGroupAfter = container.querySelector('details[data-repo-id="2"]');
    assert(!backendGroupAfter.open, 'backend-api group should remain collapsed after re-render');

    const frontendGroupAfter = container.querySelector('details[data-repo-id="1"]');
    assert(frontendGroupAfter.open, 'frontend-app group should remain open after re-render');

    collapsedRepos.clear();
});

test('Each details element has data-repo-id attribute', () => {
    renderJobsList(jobs, repos);
    const container = document.getElementById('jobs-list');
    const groups = container.querySelectorAll('details.repo-group');
    for (const g of groups) {
        assert(g.dataset.repoId, `Group should have data-repo-id attribute`);
    }
});

test('Single repo still renders as collapsible group', () => {
    const singleRepoJobs = [
        { id: 'j1', repo_id: 1, ticket: 'Job A', status: 'done', created_at: now - 100, total_cost: null },
        { id: 'j2', repo_id: 1, ticket: 'Job B', status: 'queued', created_at: now - 200, total_cost: null },
    ];
    renderJobsList(singleRepoJobs, repos);
    const container = document.getElementById('jobs-list');
    const groups = container.querySelectorAll('details.repo-group');
    assertEqual(groups.length, 1, 'Single repo still renders one collapsible group');
    assert(groups[0].querySelector('summary').textContent.includes('frontend-app'), 'Group shows repo name');
    assertEqual(groups[0].querySelectorAll('.job-list-row').length, 2, 'Group contains both jobs');
});

/* === Report === */
report();
</script>
</body>
</html>
